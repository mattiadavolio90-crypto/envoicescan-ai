name: Worker Latency Check - ONEFLUX

# ═══════════════════════════════════════════════════════════════════════════════
# Rileva il worker LENTO, non solo il worker GIÙ.
#
# Causa che questo monitor previene (incidente 2/7/2026): il worker Railway
# restava HTTP 200 su /health ma sotto carico (Admin + più clienti insieme) le
# query autenticate (/api/auth/me, Home) potevano superare il timeout SSR (12s),
# mostrando "Servizio momentaneamente non raggiungibile" ai clienti pur essendo
# il worker "vivo" secondo un check binario su/giù. uptime_check.yml (che guarda
# solo Vercel) non intercetta questo scenario: qui misuriamo la LATENZA reale
# del worker Railway.
#
# Soglia: /health non fa query DB, deve rispondere in poche centinaia di ms.
# Se supera LATENCY_THRESHOLD_MS anche solo su un ping, è un segnale che il
# threadpool del worker è sotto pressione.
#
# Dal 13/10/2026 avvisa anche quando il worker e' GIU' (prima no: si contava su
# uptime_check, che pero' guarda solo il frontend Vercel). I due allarmi passano
# da scripts/allarme_admin.py: un messaggio all'inizio, uno ogni 6 ore se dura,
# «✅ Risolto» al rientro — non piu' uno ogni 10 minuti.
#
# GITHUB SECRETS richiesti: BREVO_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
# SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (memoria degli allarmi).
#
# COSTO: 1 run/10 min, < 5s ciascuno. GitHub Actions free tier ampiamente coperto.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  LATENCY_THRESHOLD_MS: '3000'

jobs:
  check-latency:
    runs-on: ubuntu-latest
    steps:
      - name: Misura latenza /health del worker
        id: check
        env:
          # WORKER_HEALTH_URL e' un secret opzionale (stesso usato da
          # keepalive_worker.yml): se assente si usa l'URL di produzione noto.
          WORKER_URL: ${{ secrets.WORKER_HEALTH_URL || 'https://worker-production-a552.up.railway.app' }}
        run: |
          START_MS=$(date +%s%3N)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 --connect-timeout 10 \
            "${WORKER_URL}/health" || echo "000")
          END_MS=$(date +%s%3N)
          ELAPSED_MS=$((END_MS - START_MS))
          # Un errore isolato (riavvio, rete) non e' un worker giu': si riprova
          # una volta, altrimenti ogni blip darebbe un allarme e un «risolto».
          if [ "$HTTP_CODE" != "200" ]; then
            sleep 20
            START_MS=$(date +%s%3N)
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 --connect-timeout 10 \
              "${WORKER_URL}/health" || echo "000")
            ELAPSED_MS=$(( $(date +%s%3N) - START_MS ))
          fi

          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          echo "elapsed_ms=$ELAPSED_MS" >> $GITHUB_OUTPUT

          if [ "$HTTP_CODE" != "200" ]; then
            echo "problema=down" >> $GITHUB_OUTPUT
            echo "❌ Worker non risponde (HTTP $HTTP_CODE) anche al secondo tentativo"
          elif [ "$ELAPSED_MS" -gt "$LATENCY_THRESHOLD_MS" ]; then
            echo "problema=lento" >> $GITHUB_OUTPUT
            echo "⚠️ Worker lento: ${ELAPSED_MS}ms > soglia ${LATENCY_THRESHOLD_MS}ms"
          else
            echo "problema=" >> $GITHUB_OUTPUT
            echo "✅ Worker sano: ${ELAPSED_MS}ms"
          fi

      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/allarme_admin.py
          sparse-checkout-cone-mode: false

      - name: Allarme Telegram (worker giu')
        id: giu
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROBLEMA: ${{ steps.check.outputs.problema }}
          HTTP_CODE: ${{ steps.check.outputs.http_code }}
        run: |
          python3 scripts/allarme_admin.py --chiave server_giu --gravita critico \
            --problema "$([ "$PROBLEMA" = "down" ] && echo 1 || echo 0)" \
            --testo "Il server di ONEFLUX (Railway) non risponde (HTTP $HTTP_CODE): l'app si apre ma caricamenti, analisi e dati non funzionano." \
            --link "https://railway.app/dashboard" \
            --risolto "il server di ONEFLUX risponde di nuovo."

      - name: Allarme Telegram (worker lento)
        id: lento
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROBLEMA: ${{ steps.check.outputs.problema }}
          ELAPSED: ${{ steps.check.outputs.elapsed_ms }}
        run: |
          python3 scripts/allarme_admin.py --chiave server_lento --gravita critico \
            --problema "$([ "$PROBLEMA" = "lento" ] && echo 1 || echo 0)" \
            --testo "Il server di ONEFLUX e' lento: ${ELAPSED}ms per rispondere (soglia ${LATENCY_THRESHOLD_MS}ms). I clienti potrebbero vedere 'Servizio non raggiungibile'." \
            --link "https://railway.app/dashboard" \
            --risolto "il server di ONEFLUX risponde di nuovo in tempi normali."

      - name: Invia email di allerta via Brevo (worker lento)
        # Solo quando l'allarme e' dovuto (nuovo o da ripetere), non a ogni giro.
        if: always() && (steps.lento.outputs.azione == 'invia' || steps.lento.outputs.azione == 'ripeti')
        env:
          ELAPSED: ${{ steps.check.outputs.elapsed_ms }}
        run: |
          # Vedi nota in uptime_check.yml: senza -w il passo resta verde anche se
          # l'email non parte, e l'allerta diventa una finzione.
          RESP=$(curl -s -w "\n%{http_code}" -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"sender\": {\"name\": \"ONEFLUX Monitor\", \"email\": \"agent@oneflux.it\"},
              \"to\": [{\"email\": \"md@oneflux.it\", \"name\": \"Mattia\"}],
              \"subject\": \"⚠️ ONEFLUX worker lento (${ELAPSED}ms)\",
              \"htmlContent\": \"<h2>⚠️ Worker Railway sotto pressione</h2><p><code>/health</code> ha impiegato <strong>${ELAPSED}ms</strong> (soglia ${{ env.LATENCY_THRESHOLD_MS }}ms).</p><p>I clienti potrebbero vedere la schermata 'Servizio momentaneamente non raggiungibile'.</p><p>Controlla lo stato del servizio su Railway.</p>\"
            }")
          BREVO_CODE=$(echo "$RESP" | tail -n1)
          if [ "$BREVO_CODE" != "201" ] && [ "$BREVO_CODE" != "202" ]; then
            echo "::error::Alert email NON inviato (Brevo HTTP $BREVO_CODE). Rigenera BREVO_API_KEY su Brevo e aggiornala nei GitHub Secrets."
            echo "$RESP" | head -n-1
            exit 1
          fi
          echo "Alert email inviato (Brevo HTTP $BREVO_CODE)."
