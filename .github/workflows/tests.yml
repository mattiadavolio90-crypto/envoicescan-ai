name: Tests

on:
  push:
    branches:
      - main
      - progetto
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Alcuni test eseguono il codice client vero (nextSicuro del login, la
      # policy password) con `node -e`, invece di riscriverlo in Python dove
      # diverge in silenzio. Finora funzionavano perche' ubuntu-latest porta
      # node con se': dichiararlo evita che 55 test di sicurezza dipendano da
      # cosa c'e' nell'immagine.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (lock)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Run pytest with coverage gate
        # WORKER_DEV_MODE=1: salta il guard fail-closed su WORKER_SECRET_KEY
        # (i test importano services.fastapi_worker, che senza la chiave si
        # rifiuterebbe di caricare). I moduli pesanti sono comunque mockati dal
        # conftest, quindi non servono credenziali reali in CI.
        env:
          WORKER_DEV_MODE: '1'
        # Senza argomenti pytest usa `testpaths` di pytest.ini (tests +
        # legacy_streamlit). Prima qui c'era `tests/`, quindi i 9 test di
        # legacy_streamlit/ giravano solo in locale e la CI copriva MENO dello
        # sviluppatore: una rottura li' non avrebbe fermato una merge.
        # --fail-under usa la baseline di .coveragerc (misurata 50% l'8/8/2026,
        # soglia impostata a 45 per non far fallire il gate il giorno in cui si accende).
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=45

  deno-test:
    # Test delle Edge Functions (Deno): auth HMAC + routing multi-sede del webhook
    # fatture. È il path critico del go-live e non gira in pytest.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno unit tests (Edge Functions)
        # Solo i file *_test.ts (unit). Esclude test.ts (script di integration
        # manuale che richiede `supabase functions serve` + WEBHOOK_SECRET).
        run: deno test --allow-env --allow-net supabase/functions/**/*_test.ts
