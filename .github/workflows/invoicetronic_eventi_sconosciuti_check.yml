name: Invoicetronic Eventi Sconosciuti Check - ONEFLUX

# ═══════════════════════════════════════════════════════════════════════════════
# Sorveglia il webhook Invoicetronic (Voce 7, Strato 2, 28/7/2026).
#
# Causa che questo monitor previene: un evento webhook firmato (quindi davvero
# da Invoicetronic) ma non riconosciuto come "receive" valido — naming payload
# anomalo, bug di parsing tipo il PascalCase del 24/7 (200 OK, nessun errore
# visibile, fattura persa per una settimana prima che qualcuno se ne accorgesse).
# La rete di sicurezza applicativa nell'Edge Function (invoicetronic-webhook)
# impedisce che si perda in silenzio: la registra in fatture_queue con
# status='failed' + payload_meta.unrecognized_event, e lo Strato 1 (alert
# Telegram immediato dentro l'Edge Function) notifica appena succede.
#
# Questo workflow è la seconda linea: gira comunque ogni giorno, così se lo
# Strato 1 non è configurato (secrets Telegram mancanti su Supabase) o fallisce
# per qualche motivo, l'evento non riconosciuto emerge comunque entro 24h.
#
# GITHUB SECRETS richiesti:
#   WORKER_SECRET_KEY   già presente (riparto_coerenza_check.yml lo usa da 27/7)
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID   già presenti (uptime_check.yml)
#
# COSTO: 1 run/giorno, < 5s. GitHub Actions free tier ampiamente coperto.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    # Una volta al giorno, 06:45 UTC (fuori dall'orario di utilizzo clienti,
    # 15 minuti dopo riparto_coerenza_check per non sovrapporre i log).
    - cron: '45 6 * * *'
  workflow_dispatch: # avvio manuale per test

permissions:
  contents: read

env:
  WORKER_URL: 'https://worker-production-a552.up.railway.app'

jobs:
  check-eventi-sconosciuti:
    runs-on: ubuntu-latest
    steps:
      - name: Interroga /api/admin/sistema/invoicetronic-eventi-sconosciuti
        id: check
        run: |
          RESP=$(curl -s -w "\n%{http_code}" \
            -H "X-Worker-Key: ${{ secrets.WORKER_SECRET_KEY }}" \
            --max-time 30 \
            "${WORKER_URL}/api/admin/sistema/invoicetronic-eventi-sconosciuti?giorni=1" || echo -e "\n000")
          HTTP_CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Endpoint eventi-sconosciuti non raggiungibile (HTTP $HTTP_CODE)"
            echo "totale=-1" >> $GITHUB_OUTPUT
            exit 0
          fi

          TOTALE=$(echo "$BODY" | jq -r '.totale // 0')
          echo "totale=$TOTALE" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Eventi webhook non riconosciuti nelle ultime 24h: $TOTALE"

      - name: Invia alert Telegram
        if: steps.check.outputs.totale != '0'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOTALE: ${{ steps.check.outputs.totale }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram non configurato, salto."
            exit 0
          fi
          if [ "$TOTALE" = "-1" ]; then
            MSG="⚠️ Invoicetronic eventi-sconosciuti check: endpoint non raggiungibile, verifica il worker."
          else
            MSG=$(printf '⚠️ Webhook Invoicetronic: %s evento/i non riconosciuto/i nelle ultime 24h\nDettaglio: GET /api/admin/sistema/invoicetronic-eventi-sconosciuti\nRunbook: DOCUMENTAZIONE/RUNBOOK_INCIDENTI.md' "$TOTALE")
          fi
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
