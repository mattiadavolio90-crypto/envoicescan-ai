name: DB Backup - ONEFLUX

# ═══════════════════════════════════════════════════════════════════════════════
# Backup indipendente del database Supabase (progetto piano Free, niente PITR).
# pg_dump in formato custom (-Fc, compresso, ripristinabile con pg_restore)
# caricato come artifact GitHub — indipendente dal piano Supabase, protegge
# anche da un eventuale problema lato Supabase stesso.
#
# Procedura di ripristino completa, testata end-to-end il 10/8/2026 (dati
# confrontati 1:1 col DB live, restore riuscito in ~1 minuto su un Postgres
# 17 pulito): vedi docs/BACKUP_DISASTER_RECOVERY.md.
#
# GITHUB SECRET richiesto: SUPABASE_DB_URL (configurato dal 7/7/2026)
#   connection string in modalità "Session pooler" (porta 5432, host
#   aws-*.pooler.supabase.com) — Project Settings → Database → Connect →
#   "Session pooler". OBBLIGATORIO questa modalità e non la connessione
#   diretta: quella è IPv6-only sul piano Free e GitHub Actions (runner
#   ubuntu-latest) è IPv4-only, la connessione fallirebbe. Contiene la
#   password del DB: mai loggarla né stamparla in chiaro negli step.
#
# COSTO: 1 run/giorno, pochi secondi (DB ~3.8MB al 10/8). Artifact storage
# GitHub free tier: 500MB totali, ampiamente sufficiente. Retention 14
# giorni: oltre quella finestra l'artifact scade automaticamente.
#
# Se questo workflow fallisce (run rosso in Actions), GitHub notifica via
# email il proprietario del repo di default — nessun canale extra configurato
# di proposito (scelta 10/8/2026, Telegram escluso per ora).
# ═══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    # Ogni giorno alle 03:11 UTC (~05:11 CEST) — fuori orario clienti.
    - cron: '11 3 * * *'
  workflow_dispatch: # avvio manuale per test

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica secret presente
        id: check-secret
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "⚠️ SUPABASE_DB_URL non configurato — backup saltato. Vedi commento in testa al file per come aggiungerlo."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Installa client PostgreSQL 17
        # Il repo Ubuntu di default non ha il pacchetto versionato -17 (resta su
        # pg_dump 16), che rifiuta di collegarsi a un server 17.x ("server version
        # mismatch"). Serve il repo APT ufficiale PostgreSQL per la v17 giusta.
        # L'update e' limitato al solo repo appena aggiunto (Dir::Etc::sourcelist)
        # perche' il runner GitHub-hosted ha altri repo preinstallati (es. Azure
        # CLI) che falliscono saltuariamente la verifica firma e farebbero fallire
        # un "apt-get update" globale anche se PostgreSQL non c'entra.
        if: steps.check-secret.outputs.configured == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/pgdg.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y -qq postgresql-client-17

      - name: Esegui pg_dump
        if: steps.check-secret.outputs.configured == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d_%H%M%S)
          echo "STAMP=$STAMP" >> $GITHUB_ENV
          # -Fc: formato custom compresso, ripristinabile selettivamente con
          # pg_restore. --no-owner/--no-privileges: evita di portarsi dietro
          # ruoli specifici dell'istanza Supabase che non esistono altrove.
          # Percorso esplicito: update-alternatives gestisce solo psql, non
          # pg_dump — "pg_dump" nudo continuerebbe a risolvere alla v16
          # preinstallata sul runner (mismatch con il server 17.x di Supabase).
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" -Fc --no-owner --no-privileges -f "oneflux_backup_${STAMP}.dump"
          ls -lh "oneflux_backup_${STAMP}.dump"
          # Guardia esplicita: un dump "riuscito" ma vuoto/troncato (es. connessione
          # caduta a metà) uscirebbe comunque con exit 0 da pg_dump in alcuni casi.
          # Soglia 100KB è ben sotto i ~3.8MB tipici, solo per beccare un file vuoto/rotto.
          SIZE=$(stat -c%s "oneflux_backup_${STAMP}.dump")
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::Dump sospetto: solo ${SIZE} byte (atteso ~3-4MB). Backup NON affidabile."
            exit 1
          fi

      - name: Carica come artifact
        if: steps.check-secret.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oneflux-db-backup-${{ env.STAMP }}
          path: oneflux_backup_${{ env.STAMP }}.dump
          retention-days: 14
          compression-level: 0 # già compresso da pg_dump -Fc, evita doppio lavoro

      - name: Fallisci esplicitamente se il secret manca
        # Senza questo step, un backup mai configurato risulta "success" in GitHub
        # Actions (nessuno step ha fallito, sono solo stati skippati) e nessuno se ne
        # accorge. Con questo, l'assenza del secret rende il run rosso e visibile.
        if: steps.check-secret.outputs.configured != 'true'
        run: |
          echo "::error::SUPABASE_DB_URL non configurato — backup MAI eseguito. Vedi commento in testa al file."
          exit 1
