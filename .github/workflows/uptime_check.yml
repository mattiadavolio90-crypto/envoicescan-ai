name: Uptime Check - ONEFLUX

on:
  schedule:
    # Ogni 15 minuti
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permette di avviarlo manuale per testarlo

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Controlla se l'app è online
        id: ping
        run: |
          # || true evita che un timeout (curl exit 28) faccia crashare lo step: con
          # -w curl scrive gia' 000, un echo in piu' darebbe 000000.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -L \
            --max-time 60 \
            --connect-timeout 15 \
            https://app.oneflux.it/ || true)
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          if [ "$HTTP_CODE" = "200" ]; then
            echo "down=false" >> $GITHUB_OUTPUT
            echo "✅ App online (HTTP 200)"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "down=true" >> $GITHUB_OUTPUT
            echo "❌ Timeout o connessione rifiutata (nessuna risposta entro 60s)"
          else
            echo "down=true" >> $GITHUB_OUTPUT
            echo "❌ App offline (HTTP $HTTP_CODE)"
          fi

      - name: Retry dopo pausa (verifica transitoria)
        if: steps.ping.outputs.down == 'true'
        run: |
          echo "🔄 Attendo 30s e riprovo..."
          sleep 30
          WAKE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -L \
            --max-time 60 \
            --connect-timeout 15 \
            https://app.oneflux.it/ || true)
          echo "Risposta dopo wake-up: $WAKE_CODE"
          if [ "$WAKE_CODE" = "200" ]; then
            echo "woke_up=true" >> $GITHUB_OUTPUT
            echo "✅ App si è svegliata con successo!"
          else
            echo "woke_up=false" >> $GITHUB_OUTPUT
            echo "⚠️ Ancora non risponde dopo il wake-up (HTTP $WAKE_CODE)"
          fi
        id: wakeup

      # Telegram con memoria (scripts/allarme_admin.py): un messaggio quando
      # l'app va giu', di nuovo ogni 6 ore se resta giu', «✅ Risolto» quando
      # torna. Gira a ogni controllo, anche ad app sana: e' cosi' che si accorge
      # del rientro.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/allarme_admin.py
          sparse-checkout-cone-mode: false
      - name: Allarme Telegram
        id: allarme
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIU: ${{ steps.ping.outputs.down == 'true' && steps.wakeup.outputs.woke_up != 'true' }}
          HTTP_CODE: ${{ steps.ping.outputs.http_code }}
        run: |
          if [ "$HTTP_CODE" = "000" ]; then DETTAGLIO="nessuna risposta entro 60 secondi"; else DETTAGLIO="risponde HTTP $HTTP_CODE"; fi
          python3 scripts/allarme_admin.py --chiave app_offline --gravita critico \
            --problema "$([ "$GIU" = "true" ] && echo 1 || echo 0)" \
            --testo "L'app ONEFLUX e' offline: ${DETTAGLIO}. I clienti non riescono ad aprirla." \
            --link "https://app.oneflux.it/" \
            --risolto "l'app ONEFLUX e' di nuovo online."

      - name: Invia email di allerta via Brevo
        # Solo quando la memoria dice che e' un messaggio dovuto: prima partiva
        # un'email ogni 15 minuti finche' l'app restava giu'.
        if: always() && (steps.allarme.outputs.azione == 'invia' || steps.allarme.outputs.azione == 'ripeti')
        run: |
          HTTP_CODE="${{ steps.ping.outputs.http_code }}"
          if [ "$HTTP_CODE" = "000" ]; then
            DETAIL="Timeout: nessuna risposta entro 60 secondi"
          else
            DETAIL="Codice HTTP ricevuto: <strong>$HTTP_CODE</strong>"
          fi
          # -w scrive lo stato HTTP in coda alla risposta: senza, `curl -s` esce 0
          # anche con api-key invalida e il passo risulta VERDE mentre l'email non
          # parte. Un canale d'allerta che mente sul proprio stato è peggio di
          # nessun canale: BREVO_API_KEY è risultata invalida il 2/7 e nessuno se
          # n'era accorto proprio per questo.
          RESP=$(curl -s -w "\n%{http_code}" -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"sender\": {\"name\": \"ONEFLUX Monitor\", \"email\": \"agent@oneflux.it\"},
              \"to\": [{\"email\": \"md@oneflux.it\", \"name\": \"Mattia\"}],
              \"subject\": \"🚨 ONEFLUX è offline\",
              \"htmlContent\": \"<h2>⚠️ Attenzione</h2><p>L'app <strong>ONEFLUX</strong> non risponde.</p><p>$DETAIL</p><p>URL: <a href='https://app.oneflux.it/'>https://app.oneflux.it/</a></p><p>Controlla su <a href='https://vercel.com'>Vercel Dashboard</a> per lo stato del deploy.</p>\"
            }")
          BREVO_CODE=$(echo "$RESP" | tail -n1)
          if [ "$BREVO_CODE" != "201" ] && [ "$BREVO_CODE" != "202" ]; then
            echo "::error::Alert email NON inviato (Brevo HTTP $BREVO_CODE). Rigenera BREVO_API_KEY su Brevo e aggiornala nei GitHub Secrets."
            echo "$RESP" | head -n-1
            exit 1
          fi
          echo "Alert email inviato (Brevo HTTP $BREVO_CODE)."
