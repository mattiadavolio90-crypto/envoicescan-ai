name: Email settimanale - ONEFLUX

# ═══════════════════════════════════════════════════════════════════════════════
# Email settimanale dell'assistente (fase 7 del piano consulente, 24/9/2026).
# Il lunedi' alle 7 di Roma l'assistente scrive a ogni cliente attivo.
#
# DUE ESECUZIONI, DI PROPOSITO: 05:35 e 06:35 UTC. L'endpoint lavora solo il
# lunedi' fra le 7 e le 9:59 di Roma (`e_ora_di_invio`): d'estate (UTC+2) sono
# le 7:35 e le 8:35, entrambe dentro; d'inverno (UTC+1) le 6:35 (fuori) e le
# 7:35. Quando girano entrambe, il registro `email_settimanale_invii` (UNIQUE su
# utente e lunedi') fa si' che la seconda non rispedisca niente. Il :35 e non il
# :30 perche' alle 06:30 parte gia' riparto_coerenza_check.yml sullo stesso worker.
#
# SPENTA FINCHE' NON LA SI ACCENDE: qui si chiama con dry_run=false, ma l'invio
# vero parte solo se sul worker (Railway) c'e' EMAIL_SETTIMANALE_ATTIVA=1. Senza,
# l'endpoint esce subito («invio spento»): non compone, non scrive, non spedisce. Si accende nella
# fase 7c, dopo l'aggiornamento della privacy.
#
# GITHUB SECRETS richiesti (tutti gia' presenti, nessuno nuovo):
#   WORKER_SECRET_KEY                      gia' usato da retail_settore_check.yml
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID   gia' presenti (uptime_check.yml)
#
# COSTO: 2 run/settimana, pochi secondi ciascuno.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '35 5 * * 1'
    - cron: '35 6 * * 1'
  workflow_dispatch: # avvio manuale: fuori dal lunedi' 7-9:59 risponde «fuori orario»

permissions:
  contents: read

jobs:
  email-settimanale:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama /api/interno/email-settimanale
        id: invio
        env:
          WORKER_URL: ${{ secrets.WORKER_HEALTH_URL || 'https://worker-production-a552.up.railway.app' }}
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-Worker-Key: ${{ secrets.WORKER_SECRET_KEY }}" \
            --max-time 300 \
            "${WORKER_URL}/api/interno/email-settimanale?dry_run=false" || echo -e "\n000")
          HTTP_CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "$BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Endpoint email-settimanale non raggiungibile (HTTP $HTTP_CODE)"
            echo "errori=-1" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "errori=$(echo "$BODY" | jq -r '.errori // 0')" >> $GITHUB_OUTPUT
          echo "inviate=$(echo "$BODY" | jq -r '.inviate // 0')" >> $GITHUB_OUTPUT

      - name: Avviso Telegram sugli errori
        if: steps.invio.outputs.errori != '0'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ERRORI: ${{ steps.invio.outputs.errori }}
          INVIATE: ${{ steps.invio.outputs.inviate }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram non configurato, salto."
            exit 0
          fi
          if [ "$ERRORI" = "-1" ]; then
            MSG="⚠️ Email settimanale: endpoint non raggiungibile, verifica il worker."
          else
            MSG=$(printf '⚠️ Email settimanale: %s errori, %s inviate. Registro: tabella email_settimanale_invii (stato errore).' "$ERRORI" "$INVIATE")
          fi
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
