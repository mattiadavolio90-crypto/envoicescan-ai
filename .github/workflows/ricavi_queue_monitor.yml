name: Code ferme (fatture e ricavi) - ONEFLUX

# ═══════════════════════════════════════════════════════════════════════════════
# Sorveglia le due code che il queue-worker di Railway deve svuotare, e avvisa
# su Telegram se una si ferma.
#
# - ricavi_email_queue (dal 9-11 giu 2026): il queue-worker era fermo
#   (killswitch WORKER_ENABLED=0 lasciato attivo dopo un deploy). Le email
#   Passbi finivano in coda e nessuno le processava: gli incassi sparivano
#   dall'app per giorni, e l'unico segnale era l'assenza di dati.
# - fatture_queue (dal 13/10/2026): stessa cosa per le fatture SDI. Prima non la
#   guardava nessuno: una coda ferma voleva dire fatture che non arrivano al
#   cliente senza che nessuno lo sapesse.
#
# Gira QUI e non dentro il worker: un worker fermo non puo' avvisare di essere
# fermo. Gli allarmi passano da scripts/allarme_admin.py: un messaggio
# all'inizio, uno ogni 6 ore se dura, «✅ Risolto» quando la coda riparte.
#
# GITHUB SECRETS: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID, BREVO_API_KEY (copia via email del primo avviso).
#
# COSTO: 1 run/ora, < 15s ciascuno.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    # Ogni ora: una coda ferma si vede con al massimo ~1h di ritardo oltre la
    # soglia, senza rumore.
    - cron: '17 * * * *'
  workflow_dispatch: # avvio manuale per test

permissions:
  contents: read

env:
  # Oltre queste soglie una riga pending/processing vuol dire che il worker non
  # sta svuotando la coda. Le fatture si elaborano in secondi, i ricavi in pochi
  # minuti.
  STALE_MINUTES_RICAVI: '90'
  STALE_MINUTES_FATTURE: '60'

jobs:
  check-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Conta le righe ferme nelle due code
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # conta TABELLA SOGLIA_MINUTI -> stampa il numero di righe ferme, o -1
          # se la chiamata non e' andata a buon fine. Un 401 (chiave scaduta), un
          # 5xx o la rete assente non devono diventare «0 righe ferme»: il
          # monitor direbbe «coda sana» proprio quando non ha potuto guardarla
          # (trovato il 14/09/2026, mappa dei silenzi).
          conta() {
            local SOGLIA
            SOGLIA=$(date -u -d "-$2 minutes" +%Y-%m-%dT%H:%M:%S)
            curl -s -o /dev/null -D /tmp/h_$1.txt \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Prefer: count=exact" -H "Range-Unit: items" -H "Range: 0-0" \
              "$SUPABASE_URL/rest/v1/$1?select=id&status=in.(pending,processing)&created_at=lt.${SOGLIA}" || true
            local CODE
            CODE=$(grep -iE '^HTTP/' /tmp/h_$1.txt 2>/dev/null | tail -n1 | awk '{print $2}' | tr -d '\r')
            if [ "$CODE" != "200" ] && [ "$CODE" != "206" ]; then
              echo "::error::Controllo $1 NON eseguito (HTTP ${CODE:-000})" >&2
              echo -1
              return
            fi
            local N
            N=$(grep -i "content-range" /tmp/h_$1.txt | sed -E 's/.*\/([0-9]+).*/\1/' | tr -d '\r')
            echo "${N:-0}"
          }
          RICAVI=$(conta ricavi_email_queue "$STALE_MINUTES_RICAVI")
          FATTURE=$(conta fatture_queue "$STALE_MINUTES_FATTURE")
          echo "Ricavi fermi: $RICAVI · Fatture ferme: $FATTURE"
          echo "ricavi=$RICAVI" >> $GITHUB_OUTPUT
          echo "fatture=$FATTURE" >> $GITHUB_OUTPUT
          if [ "$RICAVI" -lt 0 ] || [ "$FATTURE" -lt 0 ]; then echo "cieco=1" >> $GITHUB_OUTPUT; else echo "cieco=0" >> $GITHUB_OUTPUT; fi

      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/allarme_admin.py
          sparse-checkout-cone-mode: false

      - name: Allarmi Telegram
        id: allarmi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RICAVI: ${{ steps.check.outputs.ricavi }}
          FATTURE: ${{ steps.check.outputs.fatture }}
          CIECO: ${{ steps.check.outputs.cieco }}
        run: |
          ESITO=0
          # Un conteggio a -1 non dice niente sulla coda: quella chiave non si
          # tocca (ne' apre ne' chiude), e parla l'allarme «monitor cieco».
          if [ "$FATTURE" -ge 0 ]; then
            python3 scripts/allarme_admin.py --chiave coda_fatture_ferma --gravita critico \
              --problema "$([ "$FATTURE" -gt 0 ] && echo 1 || echo 0)" \
              --testo "Coda fatture ferma: $FATTURE fatture SDI aspettano da oltre ${STALE_MINUTES_FATTURE} minuti. Le fatture non arrivano ai clienti: probabilmente il queue-worker su Railway e' fermo." \
              --link "https://railway.app/dashboard" \
              --risolto "la coda fatture e' ripartita." || ESITO=1
          fi
          if [ "$RICAVI" -ge 0 ]; then
            python3 scripts/allarme_admin.py --chiave coda_ricavi_ferma --gravita critico \
              --problema "$([ "$RICAVI" -gt 0 ] && echo 1 || echo 0)" \
              --testo "Coda ricavi ferma: $RICAVI email dei gestionali aspettano da oltre ${STALE_MINUTES_RICAVI} minuti. Gli incassi non entrano in app: probabilmente il queue-worker su Railway e' fermo." \
              --link "https://railway.app/dashboard" \
              --risolto "la coda ricavi e' ripartita." > /tmp/ricavi.txt || ESITO=1
            cat /tmp/ricavi.txt
            grep -o 'azione=[a-z]*' /tmp/ricavi.txt | tail -n1 | sed 's/^/ricavi_/' >> $GITHUB_OUTPUT
          fi
          python3 scripts/allarme_admin.py --chiave monitor_code_cieco --gravita critico \
            --problema "$([ "$CIECO" = "1" ] && echo 1 || echo 0)" \
            --testo "Il controllo delle code non riesce a leggere Supabase: non sappiamo se fatture e ricavi stanno entrando. Verifica SUPABASE_SERVICE_ROLE_KEY nei GitHub Secrets." \
            --risolto "il controllo delle code legge di nuovo Supabase." || ESITO=1
          exit $ESITO

      - name: Copia via email del primo avviso sulla coda ricavi
        # Solo quando l'allarme ricavi e' dovuto (nuovo o da ripetere): prima
        # partiva un'email a ogni giro finche' la coda restava ferma.
        if: always() && (steps.allarmi.outputs.ricavi_azione == 'invia' || steps.allarmi.outputs.ricavi_azione == 'ripeti')
        env:
          RICAVI: ${{ steps.check.outputs.ricavi }}
        run: |
          BODY=$(jq -n --arg n "$RICAVI" --arg m "$STALE_MINUTES_RICAVI" '{
            sender: {name: "ONEFLUX Monitor", email: "agent@oneflux.it"},
            to: [{email: "md@oneflux.it", name: "Mattia"}],
            subject: ("🚨 Coda ricavi ONEFLUX bloccata (" + $n + " email)"),
            htmlContent: ("<h2>Il worker ricavi non sta consumando la coda</h2><p><strong>" + $n + "</strong> email in <code>ricavi_email_queue</code> ferme da oltre " + $m + " minuti.</p><p>Gli incassi dei clienti NON stanno entrando in app. Causa piu probabile: il servizio <code>queue-worker</code> su Railway e fermo (verifica <code>WORKER_ENABLED=1</code>).</p>") }')
          BREVO_CODE=$(curl -s -o /tmp/brevo.txt -w "%{http_code}" -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          if [ "$BREVO_CODE" != "201" ] && [ "$BREVO_CODE" != "200" ] && [ "$BREVO_CODE" != "202" ]; then
            echo "::error::Email NON inviata (Brevo HTTP $BREVO_CODE): $(head -c 300 /tmp/brevo.txt)"
            exit 1
          fi
          echo "📧 Email inviata (Brevo HTTP $BREVO_CODE)"
